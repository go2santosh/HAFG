# Conda environment for HAFG (tested with these versions)
name: hafg
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pytorch=2.13.0
  - torchvision=0.28.0
  - numpy=2.5.2
  - scipy=1.18.0
  - scikit-learn=1.9.0
  - pillow=12.3.0
  - matplotlib=3.11.1
  - tqdm=4.70.0
  - tensorboard=2.20.0
  - pytorch-msssim=1.0.0
  - lpips=0.1.4
  - torchmetrics=1.9.0
  - torch-fidelity=0.3.0
  - pip
  - pip:
      - pyiqa==0.1.16
      - torchprofile==0.1.0
